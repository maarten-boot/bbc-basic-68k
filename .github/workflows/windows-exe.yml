# The Windows and Linux programs, bbc68k.exe and bbc68k (bare BBC BASIC in an
# emulated rosco_m68k), and bare BBC BASIC for a real rosco_m68k
# (ROSCODE1.BIN), built and tested by src68k/tools/ci-windows.sh, as three
# artifacts.  Runs on every push to main (a merged pull request), on a
# pushed tag v*, and by hand: Actions > Windows and Linux programs > Run
# workflow.
#
# A tag v* (e.g. v0.1, or v0.2-beta for a pre-release: a '-' in the tag)
# also publishes a GitHub release with the three files, named after the
# tag: bbc68k-TAG-windows.zip, bbc68k-TAG-linux.tar.gz, bbc68k-TAG-rosco.zip.
# The release job alone may write to the repository.
#
# The actions are pinned to commit hashes (their versions in the
# comments), all running on Node 24.
name: Windows and Linux programs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: bbc-basic-68k
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: maarten-boot/minix-st-2.0.4
          ref: feea47f05b8614ba5952b03c7c66f7170ce45ab0  # rosco-m68k, 2026-10-23
          path: minix-st-2.0.4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: maarten-boot/r68k
          ref: f0e99c32aaca95312f21f9265fd52ff150b79df0  # main: embedding console, profiler, shift timing
          path: r68k

      # retry a failed download (an Ubuntu mirror can be slow or down)
      - name: Build tools
        timeout-minutes: 40
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y zip dosfstools \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      # the version line in the READMEs: the tag's name for a release
      - name: Build and test
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) v="Version $GITHUB_REF_NAME" ;;
          *) v="Version $(date -u '+%Y-%m-%d %H:%M')" ;;
          esac
          bbc-basic-68k/src68k/tools/ci-windows.sh "$v (commit ${GITHUB_SHA::7}, GitHub Actions run $GITHUB_RUN_NUMBER)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bbc68k-windows
          path: bbc-basic-68k/build/dist/bbc68k-windows/

      # for a real rosco_m68k: ROSCODE1.BIN, BBCBASIC.BIN (for sdfat_menu)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bbc68k-rosco
          path: bbc-basic-68k/build/dist/bbc68k-rosco/

      # the tar.gz as it is, not zipped (archive: false; the artifact is
      # then named after the file): a zip would lose the executable bit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: bbc-basic-68k/build/dist/bbc68k-linux.tar.gz
          archive: false

      # for the release job: the three files, named after the tag
      - name: Release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          d=bbc-basic-68k/build/dist
          mkdir -p release
          cp "$d/bbc68k-windows.zip" "release/bbc68k-$GITHUB_REF_NAME-windows.zip"
          cp "$d/bbc68k-linux.tar.gz" "release/bbc68k-$GITHUB_REF_NAME-linux.tar.gz"
          cp "$d/bbc68k-rosco.zip" "release/bbc68k-$GITHUB_REF_NAME-rosco.zip"
          (cd release && sha256sum * > SHA256SUMS)
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: release/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          t=$GITHUB_REF_NAME
          cat > notes.md <<EOF
          BBC BASIC 68k $t: R.T. Russell's BBC BASIC (Z80) 5.4, ported to the 68000.

          | File | For |
          |---|---|
          | \`bbc68k-$t-windows.zip\` | Windows 10/11, 64-bit: \`bbc68k.exe\`, BBC BASIC in an emulated rosco_m68k |
          | \`bbc68k-$t-linux.tar.gz\` | Linux x86-64 (static): \`bbc68k\`, the same |
          | \`bbc68k-$t-rosco.zip\` | A real rosco_m68k: \`ROSCODE1.BIN\` (or \`BBCBASIC.BIN\`) for the SD card |

          Each has a README.txt. \`CHAIN "menu"\` starts the demo programs.
          Built from commit ${GITHUB_SHA::7}; SHA256SUMS has the checksums.
          EOF
          pre=
          case "$t" in *-*) pre=--prerelease ;; esac
          gh release create "$t" release/* --verify-tag $pre \
            --title "BBC BASIC 68k $t" --notes-file notes.md
